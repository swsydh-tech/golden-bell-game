<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 골든벨 - 정답 입력 및 채점 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #5eb3f6 0%, #339af0 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            font-size: 40px;
        }

        .header-content h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 24px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #5eb3f6 0%, #339af0 100%);
            color: white;
            border-color: #339af0;
        }

        .mode-btn:hover {
            border-color: #5eb3f6;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #5eb3f6;
            background-color: #f0f8ff;
        }

        .question-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #5eb3f6;
        }

        .question-number {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .question-input:focus {
            border-color: #5eb3f6;
            background-color: #f0f8ff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5eb3f6 0%, #339af0 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(83, 179, 246, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        th {
            background: #e3f2fd;
            color: #1565c0;
            font-weight: 600;
        }

        tbody tr:hover {
            background-color: #f0f8ff;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #856404;
        }

        /* 상세 모달 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 25px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
        }

        /* 제출 완료 화면 스타일 */
        .success-box {
            text-align: center;
            padding: 40px 20px;
        }
        .success-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .success-title {
            color: #333;
            font-size: 24px;
            margin-bottom: 15px;
        }
        .success-desc {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🎤</div>
            <div class="header-content">
                <h1>국어 골든벨 게임</h1>
                <p>정답 입력 및 자동 채점 시스템</p>
            </div>
        </div>

        <div class="card">
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-student" onclick="switchMode('student', this)">👨‍🎓 학생 모드</button>
                <button class="mode-btn" id="btn-teacher" onclick="switchMode('teacher', this)">👨‍🏫 선생님 모드</button>
            </div>

            <!-- 학생 모드 -->
            <div id="student" class="section active">
                <div id="studentMessage"></div>
                
                <div class="info-box">
                    💡 PPT의 문제를 보고 아래에 정답을 입력한 후 제출하세요!
                </div>

                <div class="form-group">
                    <label>이름 입력</label>
                    <input type="text" id="studentName" placeholder="예) 김철수" maxlength="20">
                </div>

                <div id="questionContainer"></div>

                <div class="button-group">
                    <button class="btn-primary" id="submitBtn" onclick="submitStudentAnswers()">📤 정답 제출</button>
                    <button class="btn-secondary" onclick="resetStudentForm()">🔄 초기화</button>
                </div>
            </div>

            <!-- 제출 완료 화면 -->
            <div id="successScreen" class="section">
                <div class="success-box">
                    <div class="success-icon">🎉</div>
                    <h2 class="success-title">정답 제출이 완료되었습니다!</h2>
                    <p class="success-desc">
                        수고하셨습니다.<br>
                        선생님의 채점 결과를 기다려주세요!
                    </p>
                </div>
            </div>

            <!-- 선생님 모드 -->
            <div id="teacher" class="section">
                <div id="teacherMessage"></div>

                <div class="info-box">
                    ✅ 정답이 자동으로 설정되었습니다. 학생들의 제출을 기다린 후 채점하세요!
                </div>

                <div style="background: #f0f8ff; border: 2px solid #5eb3f6; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="color: #333; margin-bottom: 10px;">📋 등록된 정답:</h3>
                    <div id="answerDisplay" style="font-size: 13px; line-height: 1.8; color: #555;"></div>
                </div>

                <div class="button-group" style="justify-content: flex-start;">
                    <button class="btn-primary" onclick="gradeAllStudents()">📊 채점 및 불러오기</button>
                    <button class="btn-danger" onclick="clearAllData()">🗑️ 모든 데이터 삭제</button>
                </div>

                <div style="margin-top: 40px;">
                    <h2 style="font-size: 18px; margin-bottom: 20px; color: #333;">📋 학생 채점 결과</h2>
                    <div id="resultContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 상세 보기 모달 -->
    <div id="detailModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div id="modalBody"></div>
            <div style="text-align: right; margin-top: 15px;">
                <button class="btn-secondary" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ 아래 빈칸에 1단계에서 만든 웹 앱 URL을 넣어주세요!
        const GAS_WEB_APP_URL = "https://script.google.com/macros/library/d/1dtK1QH-yvleeFXjCMmLdx3lVkD0JXQ9KyzjixeWcJQn3sSv7qapHzHoo/2";
        // ==========================================

        const TOTAL_QUESTIONS = 10;
        let cachedGradedData = [];
        
        // 정답 설정
        const CORRECT_ANSWERS = [
            "바이올렛",
            "로지",
            "예요",
            "완두콩",
            ["X", "x"],
            "너머",
            "수두",
            "나지막한",
            ["O", "o", "ㅇ", "0"],
            "에워싸다"
        ];

        // 초기화
        function init() {
            createStudentQuestions();
            displayAnswerList();
        }

        // 모드 전환 함수
        function switchMode(mode, btnElement) {
            // 선생님 모드로 진입하려 할 때 비밀번호 확인
            if (mode === 'teacher') {
                const password = prompt("선생님 모드 비밀번호를 입력하세요.\n(기본 비밀번호: 1234)");
                if (password !== "1234") {
                    alert("비밀번호가 일치하지 않습니다.");
                    return; // 비밀번호 틀리면 중단
                }
            }

            // 모든 화면 숨기기
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            // 모든 버튼 강조 색상 빼기
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            
            // 선택한 화면 표시
            document.getElementById(mode).classList.add('active');
            
            // 버튼을 클릭해서 전환한 경우 버튼 색상 켜기
            if (btnElement) {
                btnElement.classList.add('active');
            } else if (mode === 'successScreen') {
                // 제출 성공 화면일 때는 학생 모드 버튼 색상 유지
                document.getElementById('btn-student').classList.add('active');
            }

            if (mode === 'teacher') {
                gradeAllStudents();
            }
        }

        // 학생용 문제 생성
        function createStudentQuestions() {
            const container = document.getElementById('questionContainer');
            container.innerHTML = '';
            
            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                const div = document.createElement('div');
                div.className = 'question-box';
                div.innerHTML = `
                    <div class="question-number">문제 ${i}</div>
                    <input type="text" class="question-input" id="student-q${i}" placeholder="정답을 입력하세요" maxlength="50">
                `;
                container.appendChild(div);
            }
        }

        // 정답 목록 표시
        function displayAnswerList() {
            const container = document.getElementById('answerDisplay');
            let html = '';
            
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const answer = CORRECT_ANSWERS[i];
                let answerText = Array.isArray(answer) ? answer.join(' / ') : answer;
                html += `<div><strong>${i+1}번:</strong> ${answerText}</div>`;
            }
            
            container.innerHTML = html;
        }

        // 정답 비교
        function compareAnswers(studentAnswer, correctAnswer) {
            if (!studentAnswer) return false;
            const student = studentAnswer.toString().trim();
            
            if (Array.isArray(correctAnswer)) {
                return correctAnswer.some(answer => student.toLowerCase() === answer.toLowerCase());
            } else {
                return student === correctAnswer;
            }
        }

        // 학생 정답 제출
        async function submitStudentAnswers() {
            if (GAS_WEB_APP_URL.includes("여기에_주소를_붙여넣으세요")) {
                alert("Apps Script 웹 앱 URL이 설정되지 않았습니다. index.html 하단의 GAS_WEB_APP_URL 변수를 설정해주세요.");
                return;
            }

            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                showMessage('studentMessage', '이름을 입력해주세요!', 'error');
                return;
            }

            const answers = [];
            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                const input = document.getElementById(`student-q${i}`);
                answers.push(input.value.trim());
            }

            if (answers.every(a => !a)) {
                showMessage('studentMessage', '최소한 하나의 정답을 입력해주세요!', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = '제출 중...';

            const payload = {
                action: 'submit',
                name: name,
                answers: answers,
                timestamp: new Date().toLocaleString('ko-KR')
            };

            try {
                // Apps Script 웹 앱으로 데이터 전송
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // 성공 시 "제출 완료" 화면으로 전환
                switchMode('successScreen');
                
                // 학생 입력폼 비우기 (다음 테스트를 위해)
                resetStudentForm();

            } catch (err) {
                console.error(err);
                showMessage('studentMessage', '제출 중 오류가 발생했습니다. 다시 시도해주세요.', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = '📤 정답 제출';
            }
        }

        // 학생 폼 초기화
        function resetStudentForm() {
            document.getElementById('studentName').value = '';
            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                document.getElementById(`student-q${i}`).value = '';
            }
            document.getElementById('studentMessage').innerHTML = '';
        }

        // 채점 실행 및 구글 시트 데이터 불러오기
        async function gradeAllStudents() {
            if (GAS_WEB_APP_URL.includes("여기에_주소를_붙여넣으세요")) {
                showMessage('teacherMessage', 'GAS_WEB_APP_URL을 먼저 입력해주세요.', 'error');
                return;
            }

            showMessage('teacherMessage', '구글 시트에서 제출 답안을 불러오는 중...', 'info');

            try {
                const response = await fetch(GAS_WEB_APP_URL);
                const submissions = await response.json();

                if (!submissions || submissions.length === 0) {
                    showMessage('teacherMessage', '아직 제출된 학생이 없습니다.', 'info');
                    displayResults([]);
                    return;
                }

                // 채점
                const graded = submissions.map(submission => {
                    let score = 0;
                    const details = [];

                    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                        const studentAnswer = submission.answers[i] || '';
                        const correct = CORRECT_ANSWERS[i];
                        const isCorrect = compareAnswers(studentAnswer, correct);

                        if (isCorrect) score++;

                        const correctText = Array.isArray(correct) ? correct.join(' / ') : correct;

                        details.push({
                            question: i + 1,
                            student: studentAnswer,
                            correct: correctText,
                            isCorrect: isCorrect
                        });
                    }

                    return {
                        ...submission,
                        score: score,
                        details: details
                    };
                });

                // 점수순 정렬 (동점이면 시간순)
                graded.sort((a, b) => {
                    if (a.score !== b.score) return b.score - a.score;
                    return new Date(a.timestamp) - new Date(b.timestamp);
                });

                cachedGradedData = graded;
                showMessage('teacherMessage', `✅ 최신 답안 채점이 완료되었습니다! (총 ${submissions.length}명)`, 'info');
                displayResults(graded);

            } catch (err) {
                console.error(err);
                showMessage('teacherMessage', '데이터를 불러오는 중 오류가 발생했습니다.', 'error');
            }
        }

        // 결과 화면 렌더링
        function displayResults(graded) {
            const container = document.getElementById('resultContainer');
            
            if (!graded || graded.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <p>아직 제출된 결과가 없습니다.</p>
                    </div>
                `;
                return;
            }

            let html = `
                <div style="margin-bottom: 20px; font-size: 12px; color: #666;">
                    💡 ✅ = 정답, ❌ = 오답 | 동점일 경우 먼저 제출한 학생이 상위 순위입니다.
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 50px;">순위</th>
                                <th style="width: 80px;">이름</th>
                                <th style="width: 70px;">점수</th>
                                <th style="width: 60px;">정답률</th>
            `;

            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                html += `<th style="width: 35px; font-size: 11px;">Q${i}</th>`;
            }

            html += `
                                <th style="width: 100px;">제출시간</th>
                                <th style="width: 80px;">상세보기</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            graded.forEach((student, idx) => {
                const percentage = Math.round((student.score / TOTAL_QUESTIONS) * 100);
                html += `
                    <tr>
                        <td><strong style="color: #5eb3f6; font-size: 14px;">${idx + 1}등</strong></td>
                        <td><strong>${student.name}</strong></td>
                        <td><strong style="color: #5eb3f6; font-size: 16px;">${student.score}/${TOTAL_QUESTIONS}</strong></td>
                        <td><strong>${percentage}%</strong></td>
                `;

                student.details.forEach(detail => {
                    const icon = detail.isCorrect ? '✅' : '❌';
                    html += `<td style="text-align: center; font-weight: 600;">${icon}</td>`;
                });

                html += `
                        <td style="font-size: 11px; color: #999;">${student.timestamp}</td>
                        <td><button class="btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="showDetails('${student.name}')">보기</button></td>
                    </tr>
                `;
            });

            html += `
                        </tbody>
                    </table>
                </div>
            `;

            container.innerHTML = html;
        }

        // 상세 보기 모달
        function showDetails(studentName) {
            const student = cachedGradedData.find(s => s.name === studentName);
            if (!student) return;

            let html = `<h3 style="margin-bottom: 10px; color: #333;">${studentName} 학생 상세 결과</h3>`;
            html += `<p style="margin-bottom: 15px; font-weight: 600; color: #5eb3f6;">총점: ${student.score} / ${TOTAL_QUESTIONS}점</p>`;
            html += `<table style="font-size: 13px; width: 100%; border-collapse: collapse;">`;
            html += `<tr style="background: #e3f2fd;"><th style="padding: 8px;">문항</th><th style="padding: 8px;">학생 답</th><th style="padding: 8px;">정답</th><th style="padding: 8px; width: 50px;">채점</th></tr>`;

            student.details.forEach(d => {
                html += `
                    <tr>
                        <td style="padding: 8px; text-align: center; font-weight: 600;">${d.question}번</td>
                        <td style="padding: 8px;">${d.student || '<span style="color:#aaa;">(공백)</span>'}</td>
                        <td style="padding: 8px;">${d.correct}</td>
                        <td style="padding: 8px; text-align: center;">${d.isCorrect ? '✅' : '❌'}</td>
                    </tr>
                `;
            });

            html += `</table>`;

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        // 메시지 표시
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            if (type === 'info') {
                setTimeout(() => {
                    element.innerHTML = '';
                }, 3000);
            }
        }

        // 모든 데이터 초기화 (구글 시트 비우기)
        async function clearAllData() {
            if (!confirm('정말로 구글 시트의 모든 학생 제출 데이터를 삭제하시겠습니까?')) {
                return;
            }

            try {
                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'clear' })
                });

                showMessage('teacherMessage', '✅ 모든 데이터가 삭제되었습니다.', 'info');
                setTimeout(() => {
                    gradeAllStudents();
                }, 1000);
            } catch (err) {
                showMessage('teacherMessage', '삭제에 실패했습니다.', 'error');
            }
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
