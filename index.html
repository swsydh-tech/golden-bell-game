<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>국어 골든벨 - 정답 입력 및 채점 시스템</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .header {
            background: linear-gradient(135deg, #5eb3f6 0%, #339af0 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .header-icon {
            font-size: 40px;
        }

        .header-content h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .mode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .mode-btn {
            padding: 12px 24px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            color: #666;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #5eb3f6 0%, #339af0 100%);
            color: white;
            border-color: #339af0;
        }

        .mode-btn:hover {
            border-color: #5eb3f6;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Noto Sans KR', sans-serif;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #5eb3f6;
            background-color: #f0f8ff;
        }

        .question-box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #5eb3f6;
        }

        .question-number {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .question-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }

        .question-input:focus {
            border-color: #5eb3f6;
            background-color: #f0f8ff;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, #5eb3f6 0%, #339af0 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(83, 179, 246, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ee5a52;
        }

        .result-card {
            background: linear-gradient(135deg, #f0f8ff 0%, #e3f2fd 100%);
            border-left: 4px solid #5eb3f6;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .result-name {
            font-size: 18px;
            font-weight: 700;
            color: #333;
            margin-bottom: 10px;
        }

        .result-score {
            font-size: 24px;
            font-weight: 700;
            color: #5eb3f6;
            margin-bottom: 10px;
        }

        .result-answers {
            font-size: 12px;
            color: #666;
            word-break: break-all;
        }

        .correct {
            color: #52c41a;
            font-weight: 600;
        }

        .incorrect {
            color: #ff6b6b;
            font-weight: 600;
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #e0e0e0;
        }

        th {
            background: #e3f2fd;
            color: #1565c0;
            font-weight: 600;
        }

        tbody tr:hover {
            background-color: #f0f8ff;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-submitted {
            background: #d4edda;
            color: #155724;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .info-box {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #856404;
        }

        @media (max-width: 768px) {
            .card {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                text-align: center;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }

            button {
                padding: 12px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-icon">🎤</div>
            <div class="header-content">
                <h1>국어 골든벨 게임</h1>
                <p>정답 입력 및 자동 채점 시스템</p>
            </div>
        </div>

        <div class="card">
            <div class="mode-selector">
                <button class="mode-btn active" onclick="switchMode('student')">👨‍🎓 학생 모드</button>
                <button class="mode-btn" onclick="switchMode('teacher')">👨‍🏫 선생님 모드</button>
            </div>

            <!-- 학생 모드 -->
            <div id="student" class="section active">
                <div id="studentMessage"></div>
                
                <div class="info-box">
                    💡 PPT의 문제를 보고 아래에 정답을 입력한 후 제출하세요!
                </div>

                <div class="form-group">
                    <label>이름 입력</label>
                    <input type="text" id="studentName" placeholder="예) 김철수" maxlength="20">
                </div>

                <div id="questionContainer"></div>

                <div class="button-group">
                    <button class="btn-primary" onclick="submitStudentAnswers()">📤 정답 제출</button>
                    <button class="btn-secondary" onclick="resetStudentForm()">🔄 초기화</button>
                </div>
            </div>

            <!-- 선생님 모드 -->
            <div id="teacher" class="section">
                <div id="teacherMessage"></div>

                <div class="info-box">
                    ✅ 정답이 자동으로 설정되었습니다. 학생들의 제출을 기다린 후 채점하세요!
                </div>

                <div style="background: #f0f8ff; border: 2px solid #5eb3f6; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="color: #333; margin-bottom: 10px;">📋 등록된 정답:</h3>
                    <div id="answerDisplay" style="font-size: 13px; line-height: 1.8; color: #555;"></div>
                </div>

                <div class="button-group" style="justify-content: flex-start;">
                    <button class="btn-primary" onclick="gradeAllStudents()">📊 채점 실행</button>
                    <button class="btn-secondary" onclick="refreshResults()">🔄 새로고침</button>
                    <button class="btn-danger" onclick="clearAllData()">🗑️ 모든 데이터 삭제</button>
                </div>

                <div style="margin-top: 40px;">
                    <h2 style="font-size: 18px; margin-bottom: 20px; color: #333;">📋 학생 채점 결과</h2>
                    <div id="resultContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOTAL_QUESTIONS = 10;
        
        // 정답 설정 (수정할 수 없도록 고정)
        const CORRECT_ANSWERS = [
            "바이올렛",
            "로지",
            "예요",
            "완두콩",
            ["X", "x"],
            "너머",
            "수두",
            "나지막한",
            ["O", "o", "ㅇ", "0"],
            "에워싸다"
        ];

        // 초기화
        function init() {
            createStudentQuestions();
            displayAnswerList();
            displayResults();
        }

        // 모드 전환
        function switchMode(mode) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(mode).classList.add('active');
            event.target.classList.add('active');

            if (mode === 'teacher') {
                displayResults();
            }
        }

        // 학생용 문제 생성
        function createStudentQuestions() {
            const container = document.getElementById('questionContainer');
            container.innerHTML = '';
            
            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                const div = document.createElement('div');
                div.className = 'question-box';
                div.innerHTML = `
                    <div class="question-number">문제 ${i}</div>
                    <input type="text" class="question-input" id="student-q${i}" placeholder="정답을 입력하세요" maxlength="50">
                `;
                container.appendChild(div);
            }
        }

        // 정답 목록 표시
        function displayAnswerList() {
            const container = document.getElementById('answerDisplay');
            let html = '';
            
            for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                const answer = CORRECT_ANSWERS[i];
                let answerText = Array.isArray(answer) ? answer.join(' / ') : answer;
                html += `<div><strong>${i+1}번:</strong> ${answerText}</div>`;
            }
            
            container.innerHTML = html;
        }

        // 답변 비교 함수 (정답 또는 배열인 경우 처리)
        function compareAnswers(studentAnswer, correctAnswer) {
            const student = studentAnswer.trim();
            
            if (Array.isArray(correctAnswer)) {
                return correctAnswer.some(answer => student === answer);
            } else {
                return student === correctAnswer;
            }
        }

        // 학생 정답 제출
        async function submitStudentAnswers() {
            const name = document.getElementById('studentName').value.trim();
            if (!name) {
                showMessage('studentMessage', '이름을 입력해주세요!', 'error');
                return;
            }

            const answers = [];
            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                const input = document.getElementById(`student-q${i}`);
                answers.push(input.value.trim());
            }

            if (answers.every(a => !a)) {
                showMessage('studentMessage', '최소한 하나의 정답을 입력해주세요!', 'error');
                return;
            }

            try {
                // 학생 데이터
                const studentData = {
                    name: name,
                    answers: answers,
                    timestamp: new Date().toLocaleString('ko-KR')
                };

                // 기존 데이터 가져오기
                const result = await window.storage.get('golden_bell_submissions', true);
                let submissions = [];
                if (result && result.value) {
                    submissions = JSON.parse(result.value);
                }

                // 같은 이름이 있으면 덮어쓰기
                submissions = submissions.filter(s => s.name !== name);
                submissions.push(studentData);

                // 저장
                await window.storage.set('golden_bell_submissions', JSON.stringify(submissions), true);

                showMessage('studentMessage', `✅ ${name} 학생의 정답이 제출되었습니다!`, 'success');
                
                setTimeout(() => {
                    resetStudentForm();
                }, 2000);

            } catch (err) {
                console.error(err);
                showMessage('studentMessage', '제출에 실패했습니다. 다시 시도해주세요.', 'error');
            }
        }

        // 학생 폼 초기화
        function resetStudentForm() {
            document.getElementById('studentName').value = '';
            for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                document.getElementById(`student-q${i}`).value = '';
            }
            document.getElementById('studentMessage').innerHTML = '';
        }

        // 채점 실행
        async function gradeAllStudents() {
            try {
                // 제출된 답변 가져오기
                const submissionResult = await window.storage.get('golden_bell_submissions', true);
                if (!submissionResult || !submissionResult.value) {
                    showMessage('teacherMessage', '제출된 학생이 없습니다.', 'info');
                    return;
                }

                const submissions = JSON.parse(submissionResult.value);

                // 채점
                const graded = submissions.map(submission => {
                    let score = 0;
                    const details = [];

                    for (let i = 0; i < TOTAL_QUESTIONS; i++) {
                        const studentAnswer = submission.answers[i];
                        const correct = CORRECT_ANSWERS[i];
                        const isCorrect = compareAnswers(studentAnswer, correct);

                        if (isCorrect) {
                            score++;
                        }

                        // 정답 텍스트 생성
                        const correctText = Array.isArray(correct) ? correct.join(' / ') : correct;

                        details.push({
                            question: i + 1,
                            student: studentAnswer,
                            correct: correctText,
                            isCorrect: isCorrect
                        });
                    }

                    return {
                        ...submission,
                        score: score,
                        details: details
                    };
                });

                // 점수순 정렬, 같은 점수면 제출 시간이 빠른 순서
                graded.sort((a, b) => {
                    if (a.score !== b.score) {
                        return b.score - a.score;
                    }
                    // 점수가 같으면 제출 시간이 빠른 순서
                    return new Date(a.timestamp) - new Date(b.timestamp);
                });

                // 결과 저장
                await window.storage.set('golden_bell_graded_results', JSON.stringify(graded), true);

                showMessage('teacherMessage', `✅ 채점이 완료되었습니다! (${submissions.length}명)`, 'success');
                displayResults();

            } catch (err) {
                console.error(err);
                showMessage('teacherMessage', '채점에 실패했습니다.', 'error');
            }
        }

        // 결과 새로고침
        function refreshResults() {
            displayResults();
            showMessage('teacherMessage', '새로고침되었습니다.', 'info');
        }

        // 결과 표시
        async function displayResults() {
            const container = document.getElementById('resultContainer');
            
            try {
                const result = await window.storage.get('golden_bell_graded_results', true);
                
                if (!result || !result.value) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>아직 채점된 결과가 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                const graded = JSON.parse(result.value);

                let html = `
                    <div style="margin-bottom: 20px; font-size: 12px; color: #666;">
                        💡 ✅ = 정답, ❌ = 오답 | 같은 점수면 먼저 제출한 순서가 순위입니다.
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th style="width: 50px;">순위</th>
                                    <th style="width: 80px;">이름</th>
                                    <th style="width: 70px;">점수</th>
                                    <th style="width: 60px;">정답률</th>
                `;

                // 문제 번호 헤더
                for (let i = 1; i <= TOTAL_QUESTIONS; i++) {
                    html += `<th style="width: 35px; font-size: 11px;">Q${i}</th>`;
                }

                html += `
                                    <th style="width: 100px;">제출시간</th>
                                    <th style="width: 80px;">상세보기</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                graded.forEach((student, idx) => {
                    const percentage = Math.round((student.score / TOTAL_QUESTIONS) * 100);
                    html += `
                        <tr>
                            <td><strong style="color: #5eb3f6; font-size: 14px;">${idx + 1}등</strong></td>
                            <td><strong>${student.name}</strong></td>
                            <td><strong style="color: #5eb3f6; font-size: 16px;">${student.score}/${TOTAL_QUESTIONS}</strong></td>
                            <td><strong>${percentage}%</strong></td>
                    `;

                    // 문제별 정답/오답 표시
                    student.details.forEach(detail => {
                        const icon = detail.isCorrect ? '✅' : '❌';
                        html += `<td style="text-align: center; font-weight: 600;">${icon}</td>`;
                    });

                    html += `
                            <td style="font-size: 11px; color: #999;">${student.timestamp}</td>
                            <td><button class="btn-secondary" style="padding: 6px 12px; font-size: 12px;" onclick="showDetails('${student.name}')">보기</button></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;

                container.innerHTML = html;

            } catch (err) {
                console.error(err);
                container.innerHTML = `
                    <div class="message error">
                        결과를 불러올 수 없습니다.
                    </div>
                `;
            }
        }

        // 상세 보기
        async function showDetails(studentName) {
            try {
                const result = await window.storage.get('golden_bell_graded_results', true);
                if (!result || !result.value) return;

                const graded = JSON.parse(result.value);
                const student = graded.find(s => s.name === studentName);

                if (!student) return;

                let details = `<h3 style="margin-bottom: 15px; color: #333;">${studentName} 학생 상세 결과</h3>`;
                details += `<p style="margin-bottom: 15px; font-weight: 600;">점수: ${student.score}/${TOTAL_QUESTIONS}</p>`;
                details += `<table style="font-size: 13px; width: 100%; border-collapse: collapse;">`;
                details += `<tr style="background: #e3f2fd; font-weight: 600;"><th style="padding: 10px; border: 1px solid #e0e0e0; text-align: center;">문제</th><th style="padding: 10px; border: 1px solid #e0e0e0;">학생 답</th><th style="padding: 10px; border: 1px solid #e0e0e0;">정답</th><th style="padding: 10px; border: 1px solid #e0e0e0; width: 50px;">채점</th></tr>`;

                student.details.forEach(detail => {
                    const statusClass = detail.isCorrect ? 'correct' : 'incorrect';
                    const statusText = detail.isCorrect ? '✅' : '❌';
                    details += `
                        <tr>
                            <td style="padding: 10px; border: 1px solid #e0e0e0; text-align: center; font-weight: 600;">${detail.question}</td>
                            <td style="padding: 10px; border: 1px solid #e0e0e0;">${detail.student || '(공백)'}</td>
                            <td style="padding: 10px; border: 1px solid #e0e0e0;">${detail.correct}</td>
                            <td style="padding: 10px; border: 1px solid #e0e0e0; text-align: center; class="${statusClass}">${statusText}</td>
                        </tr>
                    `;
                });

                details += `</table>`;

                alert(details);

            } catch (err) {
                alert('상세 정보를 불러올 수 없습니다.');
            }
        }

        // 메시지 표시
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            if (type === 'success') {
                setTimeout(() => {
                    element.innerHTML = '';
                }, 3000);
            }
        }

        // 모든 데이터 삭제
        async function clearAllData() {
            if (!confirm('정말로 모든 데이터를 삭제하시겠습니까? 이 작업은 되돌릴 수 없습니다.')) {
                return;
            }

            try {
                await window.storage.delete('golden_bell_submissions', true);
                await window.storage.delete('golden_bell_graded_results', true);

                showMessage('teacherMessage', '✅ 모든 데이터가 삭제되었습니다.', 'success');
                displayResults();

            } catch (err) {
                showMessage('teacherMessage', '삭제에 실패했습니다.', 'error');
            }
        }

        // 페이지 로드 시 초기화
        window.addEventListener('load', init);
    </script>
</body>
</html>
